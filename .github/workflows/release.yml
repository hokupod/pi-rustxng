name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-checks
      - run: node scripts/release-package.mjs tag
      - run: node scripts/check.mjs
      - run: node scripts/release-package.mjs pack
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-checks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-package
          path: .artifacts/release/
      - run: node scripts/release-package.mjs tag
      - run: node scripts/release-package.mjs verify
      - name: Publish verified tarball through npm OIDC
        run: npm publish .artifacts/release/pi-rustxng.tgz --access public --ignore-scripts
