name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '>=24.22.3 <25'
          check-latest: true
          package-manager-cache: false
      - uses: ./.github/actions/setup-checks
      - run: node scripts/release-package.mjs tag
      - run: node scripts/check.mjs
      - run: node scripts/release-package.mjs pack
      - run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-package
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '>=24.22.3 <25'
          check-latest: true
          package-manager-cache: false
      - uses: ./.github/actions/setup-checks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-package
          path: .artifacts/release/
      - run: node scripts/release-package.mjs tag
      - run: node scripts/release-package.mjs verify
      - name: Publish verified tarball through npm OIDC
        run: npm publish .artifacts/release/pi-rustxng.tgz --access public --ignore-scripts
